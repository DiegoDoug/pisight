name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only ever reads the repository. No token with write access is
# available to any job, so a malicious dependency cannot push, tag or open a release.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every UI job runs headless. No display, no hardware, no credentials anywhere in CI.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    # 3.11 matches the Raspberry Pi OS deployment target and is the required gate.
    # 3.14 is a forward-compatibility signal only: a failure unique to it must not block
    # the MVP, so it is allowed to fail without failing the workflow.
    continue-on-error: ${{ matrix.python-version == '3.14' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDL runtime libraries
        # pygame-ce ships manylinux wheels, but SDL still needs these shared objects at
        # import time even under the dummy video driver.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-ttf-2.0-0 \
            libfreetype6 fonts-dejavu-core

      - name: Install PiSight
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        run: mypy src

      - name: Run tests
        run: pytest --cov=pisight --cov-report=term-missing --cov-report=xml

      - name: Check shell script syntax
        run: bash -n scripts/*.sh

      - name: Build the package
        run: python -m build

      - name: Verify the built package installs and runs
        run: |
          python -m pip install --force-reinstall dist/*.whl
          pisight --version

      - name: Headless UI smoke test
        # Exercises the real event loop, polling thread, rendering and teardown.
        run: pisight --mode mock --smoke-seconds 5

      - name: Verify the doctor runs off-hardware
        # Must complete without a radio, a display or a Kismet instance.
        run: pisight doctor --no-network --json > doctor-report.json

      - name: Generate screenshots
        run: pisight screenshots --output artifacts/screenshots

      - name: Verify every screenshot is exactly 320x240
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          import pygame

          pygame.init()
          pygame.display.set_mode((320, 240))

          expected = {"overview.png", "channels.png", "devices.png", "alerts-system.png"}
          directory = Path("artifacts/screenshots")
          found = {path.name for path in directory.glob("*.png")}

          if found != expected:
              sys.exit(f"expected {sorted(expected)}, found {sorted(found)}")

          for name in sorted(expected):
              size = pygame.image.load(str(directory / name)).get_size()
              if size != (320, 240):
                  sys.exit(f"{name} is {size}, expected (320, 240)")
              print(f"{name}: {size} OK")
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-py${{ matrix.python-version }}
          path: artifacts/screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-report-py${{ matrix.python-version }}
          path: doctor-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the built distributions
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  required:
    # A single job for the branch-protection rule to require, so the optional 3.14 leg
    # cannot block a merge.
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: quality
    if: always()
    steps:
      - name: Confirm the supported matrix succeeded
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "The quality matrix did not succeed (result: ${{ needs.quality.result }})."
            echo "Note: a failure unique to Python 3.14 is allowed and does not appear here."
            exit 1
          fi
          echo "All required checks passed."
